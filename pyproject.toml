[project]
name = "quarter-state-dfm-segmentation"
version = "0.2.0"
description = "Quarter-resolution Discrete Flow Maps segmentation for Cityscapes and ADE20K"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
full = [
    "matplotlib==3.10.9",
    "numpy==2.4.4",
    "pyyaml==6.0.3",
    "pytest==9.1.1",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "transformers==5.10.2",
    "wandb==0.27.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
