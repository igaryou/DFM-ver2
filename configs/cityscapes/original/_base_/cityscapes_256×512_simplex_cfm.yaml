extends: cityscapes_256x512_800ep_rrdb.yaml

experiment:
  name: dfm_cityscapes_original_gaussian
  output_dir: /home/igarashi_25/DFM/results/cityscapes/original_gaussian

source:
  prior_type: gaussian
  prior_noise_std: 1.0

model:
  unet:
    base_channels: 54

training:
  checkpoint_interval_epochs: 100
  validation_epochs:
    [499, 600, 700, 800]

loss:
  consistency:
    enabled: true
    type: psd
    weight: 0.5

    start_epoch: 499
    start:
      unit: epoch
      value: 499

    warmup_epochs: 50
    warmup_steps: 0
    schedule: linear
    max_weight: 1.0

    psd:
      loss_resolution: state
      ignore_void: false

evaluation:
  interval:
    unit: epoch
    value: null

wandb:
  name: dfm-cityscapes-psd