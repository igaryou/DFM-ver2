extends: ../../../_base_/cityscapes/swin_t_160k.yaml
experiment:
  name: dfm_original_cityscapes_256x512_800ep
  output_dir: /home/igarashi_25/DFM/results/cityscapes/original/base_256x512_800ep
  stage: joint_training
dataset:
  protocol: original
  root: /home/igarashi_25/datasets/cityscapes
  image_size: [256, 512]
  crop_size: null

  num_workers: 4
  pin_memory: true
  persistent_workers: false

  fixed_resize:
    enabled: true
    image_interpolation: bilinear
    mask_interpolation: nearest
    antialias: true
augmentation:
  enabled: true
  horizontal_flip: {enabled: true, probability: 0.5}
  color_jitter: {enabled: true, brightness: 0.2, contrast: 0.2, saturation: 0.2, hue: 0.1}
  imagenet_normalize: false
  random_resize: {enabled: false}
  random_crop: {enabled: false}
  photometric_distortion: {enabled: false}
  normalize:
    enabled: true
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  pad: {enabled: false}
training:
  schedule_unit: epoch
  epochs: 800
  max_optimizer_steps: null
  batch_size: 4
  grad_accum_steps: 1
  checkpoint_interval_epochs: 50
  checkpoint_interval_steps: null
  validation_epochs: [1, 25, 50, 75, 100, 125, 150, 200, 300, 400, 500, 600, 700, 800]
  optimizer:
    parameter_groups:
      model: {lr: 1.0e-4}
      source: {lr: 1.0e-5}
  scheduler:
    name: cosine
    step_unit: epoch
    warmup_epochs: 10
    warmup_steps: 0
    warmup_start_factor: 0.1
    eta_min: 5.0e-7
evaluation:
  original_resolution: false
  num_steps: 5
  num_samples: 1
  aggregation: probability_mean
  batch_size: 4
  interval: {unit: epoch, value: 25}
  eval_class_indices: [0, 18]
  ignore_index: 19
  exclude_void_from_prediction: true
